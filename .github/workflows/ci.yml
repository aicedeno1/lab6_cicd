name: CI/CD workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        run: npm install

      - name: lint del codigo
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm test

  despliegue-produccion:
    name: desplegar vercel
    runs-on: ubuntu-latest
    needs: build-and-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: instalar Vercel CLI
        run: npm install -g vercel

      - name: Obtener configuracion de Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCELTOKEN }}

      - name: Construir el proyecto
        run: vercel --build --prod --token=${{ secrets.VERCELTOKEN }}

      - name: Desplegar en produccion
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCELTOKEN }}